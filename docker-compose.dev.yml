# Local development overlay — OPT-IN (not auto-merged).
#
# Named `docker-compose.dev.yml` (not `…override.yml`) on purpose: deploy hosts
# run a plain `docker compose up -d` and get ONLY the base file (pulls the
# published farbhaus/farbstrom image), with no way to accidentally build from
# source. Developers opt into this overlay explicitly.
#
# It builds the image from source and bind-mounts ./www so frontend edits
# (`tsc` rebuilds) show up without a Docker rebuild. The bind mount shadows the
# image's baked www/dist, so www/dist must exist on the host first. `make dev`
# builds it for you (the frontend-build target). If you invoke compose directly
# instead, build it yourself first (cd frontend && npm ci && npm run build):
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Tip: `export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml` makes a
# bare `docker compose …` pick up both for the rest of your shell session.
services:
  farbstrom:
    build:
      context: .
      # Honor the component pins from .env for local source builds. (Defaults
      # live in the Dockerfile and are what CI bakes into the published image.)
      args:
        OME_VERSION: ${OME_TAG:-v0.21.0}
        LIVEKIT_VERSION: ${LIVEKIT_TAG:-v1.13.5}
        CADDY_VERSION: ${CADDY_TAG:-2.11.4}
        VALKEY_VERSION: ${VALKEY_TAG:-9.1.1}
    volumes:
      # Live frontend assets over the copy baked into the image. Requires
      # www/dist to exist on the host — `make dev` builds it (frontend-build);
      # for a direct compose run, `cd frontend && npm ci && npm run build` first.
      - ./www:/www
    ports:
      # OME's signalling/LLHLS port, published for local WHIP ingest testing.
      # The admin panel's WHIP URL goes through Caddy on https://localhost, whose
      # certificate is signed by Caddy's internal CA — libcurl-based clients (OBS
      # included) reject it, so a local WHIP push fails before ICE is reached.
      # Pushing to http://localhost:3333/live/<key>?direction=whip skips both TLS
      # and Caddy. Dev overlay only — the base compose file does not publish this.
      - "3333:3333"
