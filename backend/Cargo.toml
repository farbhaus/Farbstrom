[package]
name = "stream-backend"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.19"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
sha2 = "0.10"
base64 = "0.22"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
tower_governor = "0.7"
governor = "0.8"
totp-rs = { version = "5.7.1", features = ["qr"] }
webauthn-rs = { version = "0.5", default-features = false }
# webauthn-rs hard-depends on OpenSSL. This project builds musl-static with no
# system OpenSSL, so vendor it (compiled statically into the binary).
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
axum-test = "17"

[profile.release]
lto = true
strip = true
