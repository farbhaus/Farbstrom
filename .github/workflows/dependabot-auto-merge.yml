name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only into dev, which requires CI to pass. main requires nothing, so
    # `gh pr merge --auto` there merges on the spot, failing checks and all —
    # that is how #269 reached main with a red audit when Dependabot
    # retargeted it mid-rebase.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Not the player libraries, at any level: an OvenPlayer patch can rename
      # the classes the viewer's CSS hides its chrome by, and all three change
      # what every viewer runs. Their PRs wait for a by-hand playback check.
      - name: Enable auto-merge for patch and minor updates only
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch'
            || steps.metadata.outputs.update-type == 'version-update:semver-minor')
          && !contains(steps.metadata.outputs.dependency-names, 'ovenplayer')
          && !contains(steps.metadata.outputs.dependency-names, 'livekit-client')
          && !contains(steps.metadata.outputs.dependency-names, 'hls.js')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}