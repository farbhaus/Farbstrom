name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mold and clang
        # Required by backend/.cargo/config.toml, which uses mold as the
        # linker for x86_64-unknown-linux-gnu builds.
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo fmt
        run: cargo fmt -- --check
        working-directory: backend
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: backend
      - name: cargo build
        run: cargo build --release
        working-directory: backend
      - name: cargo test
        run: cargo test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: frontend
      - name: typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend
      # Enforces that www/shared/tokens.css stays the only source of raw design
      # values. The convention was documented long before this gate existed and
      # drifted anyway — 43 hardcoded radii, 28 of them restating a token that
      # already existed. Also catches dead and undefined tokens.
      - name: design lint
        run: ./scripts/design-lint.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo-audit is a self-contained binary that reads Cargo.lock — no
      # Rust toolchain or workspace cache needed. Prebuilt install avoids
      # the multi-minute from-source `cargo install` on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
        working-directory: backend
