name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Read-only token: nothing here writes to the repository. Actions are pinned
# to commit SHAs (tag in the trailing comment, which Dependabot keeps current).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mold and clang
        # Required by backend/.cargo/config.toml, which uses mold as the
        # linker for x86_64-unknown-linux-gnu builds.
        run: sudo apt-get update && sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - name: cargo fmt
        run: cargo fmt -- --check
        working-directory: backend
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: backend
      - name: cargo build
        run: cargo build --release
        working-directory: backend
      - name: cargo test
        run: cargo test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 26 — the active LTS line, and what the Dockerfile's frontend
          # stage builds with. (20 reached end of life in April 2026.)
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
        working-directory: frontend
      - name: typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: build
        run: npm run build
        working-directory: frontend
      # Enforces that www/shared/tokens.css stays the only source of raw design
      # values. The convention was documented long before this gate existed and
      # drifted anyway — 43 hardcoded radii, 28 of them restating a token that
      # already existed. Also catches dead and undefined tokens.
      - name: design lint
        run: ./scripts/design-lint.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-audit is a self-contained binary that reads Cargo.lock — no
      # Rust toolchain or workspace cache needed. Prebuilt install avoids
      # the multi-minute from-source `cargo install` on every run.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
        working-directory: backend
