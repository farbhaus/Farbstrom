name: Docker Build (single-container)

# Builds and publishes the all-in-one single-container image (Caddy + backend +
# OME + LiveKit + Valkey under supervisord) from the repo-root Dockerfile. The
# image is self-contained — it compiles the Rust backend and the TypeScript
# frontend internally, so deploy hosts need neither the source nor a toolchain.

on:
  push:
    branches: [main]
    # Publishing is TAG-ONLY: pushing a v*.*.* tag publishes immutable :vX.Y.Z +
    # :vX.Y and moves :latest to it. A push to main (below) only build-validates.
    tags: ['v*.*.*']
  # PR validation only when an input to the single-container image changes.
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'www/**'
      - 'ome/**'
      - 'caddy/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'ome_start.sh'
      - 'supervisord.conf'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/docker-single.yml'

env:
  IMAGE: farbhaus/farbstrom

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publish ONLY on a v*.*.* release tag. Pushes to main and PRs build the
      # image as a CI safety net but push nothing to Docker Hub.
      - name: Decide whether to publish
        id: pub
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.pub.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag-only scheme: a v*.*.* tag → :vX.Y.Z + :vX.Y (git tag == Docker tag)
      # and :latest tracks the newest release. latest=false disables the action's
      # auto-latest so the raw entry is the single source of truth. Non-tag builds
      # produce an empty tag list (nothing is published — push=false above).
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.pub.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Refresh the repo-visible attribution file on a release tag.
  #
  # The image generates its own copy at build time (Dockerfile stage 1) — that
  # is the one that matters for compliance, since it ships inside the artifact
  # being redistributed. This job only keeps docs/THIRD_PARTY_NOTICES.md, which
  # README and CONTRIBUTING link to, in step with the release.
  #
  # Deliberately NOT a per-PR diff gate. It used to be one in ci.yml, and every
  # dependabot cargo bump turned CI red for a generated file — while blocking
  # nothing, since main is unprotected and auto-merge shipped the drift anyway
  # (that is how a stale uuid line reached main and broke unrelated PRs).
  notices:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Commit onto main, not the tag: a tag is not a branch, and releases are
      # cut from main so its lockfile is the one the tag was built from.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install cargo-about
        # Pinned to match the Dockerfile's CARGO_ABOUT_VERSION — notice output
        # differs across versions, so an unpinned binary would churn the file.
        run: |
          curl -fsSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.0/cargo-about-0.9.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/cargo-about'
      - name: Regenerate third-party notices
        run: cargo about generate about.hbs -o ../docs/THIRD_PARTY_NOTICES.md
        working-directory: backend
      - name: Commit if changed
        # Pushes with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
        run: |
          if git diff --quiet -- docs/THIRD_PARTY_NOTICES.md; then
            echo "Notices already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/THIRD_PARTY_NOTICES.md
          git commit -m "chore(licenses): refresh third-party notices for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
