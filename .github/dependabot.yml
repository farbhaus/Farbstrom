version: 2
# Every ecosystem targets `dev`, not the default branch. Dependabot reads this
# file from the default branch (`main`), so a change here only takes effect
# once it has been merged to `main`.
updates:
  # Majors are proposed too. They used to be ignored outright, which for 0.x
  # crates — every 0.y bump counts as major — meant rusqlite, reqwest,
  # tower-http, the RustCrypto set and more simply never arrived. Auto-merge
  # still takes only patch and minor; a major waits for review.
  - package-ecosystem: "cargo"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  # TypeScript and the three player libraries vendored into www/dist/vendor.
  # The players' bumps open PRs but are never auto-merged (see
  # dependabot-auto-merge.yml): OvenPlayer's class names are load-bearing for
  # the viewer's CSS, and each one changes what every viewer runs.
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  # Watches only the literal `FROM` bases: rust, ubuntu, node. It CANNOT see the
  # OME / LiveKit / Caddy / Valkey pins — those are `ARG`s interpolated into FROM
  # (`FROM caddy:${CADDY_VERSION}`), which Dependabot does not resolve. Those four
  # stay manual; see "Updating pinned components" in CLAUDE.md.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ubuntu's numbers are calendar-based, not semver. 22.04 -> 22.10 looks
      # like a routine minor bump, so it slipped past the wildcard above,
      # auto-merged (#234) and broke every image build on main: the `.10`
      # interims are EOL and their apt repos 404. The valkey-builder base is
      # also glibc-matched to the final OME image, so it cannot advance to a
      # newer LTS either. Pinned by hand — see the note in the Dockerfile.
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-minor"]
