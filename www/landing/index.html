<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Farbstrom</title>
<link rel="icon" type="image/svg+xml" href="/shared/favicon.svg">
<link rel="icon" type="image/png" href="/shared/favicon.png">
<link rel="apple-touch-icon" href="/shared/favicon.png">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/components.css">
<link rel="stylesheet" href="/shared/utils.css">
<style>
body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
}

/* .screen-logo, .brand-wordmark and .landing-* live in components.css — they
   were byte-identical here and in the viewer's landing screen. */

/* Mobile (700px = shared breakpoint, see tokens.css): .panel-box trims its own
   padding at this width; only the copy spacing is page-specific. */
@media (max-width: 700px) {
    .landing-sub { margin-bottom: var(--sp-6); }
}
</style>
</head>
<body>

<div class="panel-box">
    <img src="" alt="" class="screen-logo u-hidden" id="brand-logo">
    <div class="brand-wordmark u-hidden" id="brand-fallback">Farbstrom</div>
    <div class="landing-title">Welcome</div>
    <div class="landing-sub">It appears you forgot the room link for your project. Please enter your room link below or ask your host for the correct URL.</div>
    <div class="form-row">
        <input type="text" id="landing-input" placeholder="/room-name-123abc" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn btn-primary btn-lg btn-block" id="landing-btn">Go to Room</button>
    <p class="landing-error" id="landing-error"></p>
    <div class="panel-foot"><a href="/privacy">Privacy &amp; Cookies</a></div>
</div>

<script type="module" src="/dist/landing/main.js"></script>
</body>
</html>
